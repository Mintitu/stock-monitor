name: Stock Watch
on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * 1' # Mondays 13:30 UTC
permissions:
  contents: read
jobs:
  stock-watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py
      - uses: actions/upload-artifact@v4
        with:
          name: stock-watch-report
          path: output/
          if-no-files-found: error
          retention-days: 30
